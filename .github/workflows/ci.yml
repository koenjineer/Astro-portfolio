# プルリクエストごとに、3つのアプリそれぞれで lint と型チェックを自動で走らせる。
# 説明は /rules/ci.md。チェック名「check (アプリ名)」はマージ条件に使うので変えないこと。
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 読み取りだけ。Secrets も使わない（公開リポジトリなので最小権限にしておく）
permissions:
  contents: read

# 同じブランチに続けてプッシュしたら、古い実行は止めて最新だけ見る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 1つのアプリが落ちても、残りのアプリの結果も最後まで見られるようにする
      fail-fast: false
      matrix:
        app: [astro-portfolio, global-standard-next, minami-dental-next]
        include:
          - app: astro-portfolio
            typecheck: pnpm exec astro check
          # next-env.d.ts はGitに入っていない（自動生成ファイル）。
          # 無いと型チェックが落ちるので、先に next typegen で作ってから tsc にかける
          - app: global-standard-next
            typecheck: pnpm exec next typegen && pnpm exec tsc --noEmit
          - app: minami-dental-next
            typecheck: pnpm exec next typegen && pnpm exec tsc --noEmit
    # アプリごとに pnpm-lock.yaml を持つ独立構成なので、各アプリのフォルダで実行する
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    # ビルド（next build / astro build）はここでは行わない。
    # Next.jsの2サイトはビルド時に手元のMacにしか無いWordPressを読むため、
    # GitHub上ではビルドできない。ビルドは手元で行う（/rules/nextjs-static-export.md）
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml

      # ロックファイルどおりに入れる。ずれていたら失敗させる
      - name: Install
        run: pnpm install --frozen-lockfile

      # 警告は失敗扱いにしない（エラーだけで落ちる）
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: ${{ matrix.typecheck }}
